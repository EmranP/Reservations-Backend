services:
  db:
    image: postgres:18.1-bookworm
    container_name: ${POSTGRES_DB}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:${POSTGRES_PORT}'
    volumes:
      - '${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql'
    networks:
      - 'reservations-net'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: '5s'
      timeout: '5s'
      retries: 5
      start_period: '7s'

  redis:
    image: redis:7.4-alpine
    container_name: redis-reservations
    restart: always
    command:
      [
        'sh',
        '-c',
        'redis-server --requirepass "$REDIS_PASS" --appendonly yes --appendfsync everysec',
      ]
    ports:
      - ${REDIS_PORT}:${REDIS_PORT}
    networks:
      - 'reservations-net'
    volumes:
      - '${PROJECT_ROOT}/out/cache:/var/lib/cache'
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources: # 5. Ограничение ресурсов (чтобы контейнер не уронил сервер)
        limits:
          cpus: '1.0'
          memory: 2gb
        reservations:
          memory: 512mb

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reservations-app
    env_file:
      - .env
    ports:
      - ${PORT}:${PORT}
    volumes:
      - '.:/app'
      - /app/node_modules
    networks:
      - 'reservations-net'
    depends_on:
      db:
        condition: service_healthy

  S3:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: minio-S3
    restart: unless-stopped
    command: server /var/lib/storage/data{1...4} --console-address ":9001"
    env_file:
      - .env
    ports:
      - '${MINIO_PORT_API}:${MINIO_PORT_API}'
      - '${MINIO_PORT_WEB}:${MINIO_PORT_WEB}'
    networks:
      - 'reservations-net'
    volumes:
      - ${PROJECT_ROOT}/out/storage/minio_data1:/var/lib/storage/data1
      - ${PROJECT_ROOT}/out/storage/minio_data2:/var/lib/storage/data2
      - ${PROJECT_ROOT}/out/storage/minio_data3:/var/lib/storage/data3
      - ${PROJECT_ROOT}/out/storage/minio_data4:/var/lib/storage/data4
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  port-forward:
    image: alpine/socat:1.8.1.3
    container_name: reservations-port-forward
    restart: always
    env_file:
      - .env
    ports:
      - '${HOSTNAME}:5433:${POSTGRES_PORT}'
    command:
      - 'tcp-listen:${POSTGRES_PORT},fork,reuseaddr'
      - 'tcp-connect:db:${POSTGRES_PORT}'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - 'reservations-net'

  pgadmin:
    image: dpage/pgadmin4
    container_name: reservation-pgadmin-panel
    env_file:
      - '.env'
    ports:
      - '5050:80'
    volumes:
      - '${PROJECT_ROOT}/out/pgadmin:/var/lib/pgadmin'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - 'reservations-net'

networks:
  reservations-net:
    driver: bridge
